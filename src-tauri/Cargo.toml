[package]
name = "huangguo-client"
version = "0.0.2"
description = "HGhub · 插件视频播放器"
authors = ["HGhub"]
license = "PolyForm-Noncommercial-1.0.0"
edition = "2021"
rust-version = "1.90"

[lib]
name = "huangguo_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "=2.7.2"
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-fs = "=2.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
hghub-hpp = { path = "crates/hpp" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "stream"] }
sha2 = "0.10"
base64 = "0.22"

[patch.crates-io]
rquickjs-sys = { path = "vendor/rquickjs-sys" }

# macOS 红绿灯垂直居中需要读取 AppKit 按钮尺寸（见 src/macos_titlebar.rs）。
# 三者均已是 tao/wry 的间接依赖，版本与 Cargo.lock 一致；只开启用到的 feature。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSButton",
  "NSControl",
  "NSGraphics",
  "NSResponder",
  "NSView",
  "NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }

# Avoid invalid incremental object references on filesystems without hard links.
[profile.dev]
incremental = false

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
